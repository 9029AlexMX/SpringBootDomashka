databaseChangeLog:
  -  changeSet:
       id: todo-create-table
       author:  alexey.fedorov
       changes:
         - createTable:
             columns:
               - column:
                  constraints:
                    primaryKey: true
                    nullable: false
                  name: id
                  type: bigint
                  autoIncrement: true
               - column:
                   name:  title
                   type:  varchar(100)
                   constraints:
                     nullable: false
               - column:
                   name: description
                   type: varchar(500)
               - column:
                   name: due_date
                   type: TIMESTAMP
                   constraints:
                     nullable: false
               - column:
                   name: priority
                   type: varchar(32)
                   constraints:
                     nullable: false
               - column:
                   name: status
                   type: tinyint
                   constraints:
                     nullable: false
               - column:
                   name: created_at
                   type: TIMESTAMP
                   constraints:
                     nullable: false
               - column:
                   name: updated_at
                   type: TIMESTAMP
               - column:
                   name: user_id
                   type: bigint
                   constraints:
                     nullable: false
             tableName:  todo
       rollback:
         - dropTable:
             tableName: todo